<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>From text to next token: the loop of a language model</title><defs><marker id="m7a1f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f2b"/></marker><marker id="m173541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#173541"/></marker><marker id="me95459" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e95459"/></marker><marker id="m626a70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#626a70"/></marker><marker id="m252a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252a30"/></marker></defs>
<rect x="10" y="70" width="150" height="120" rx="10" fill="#f3f5f6" stroke="#173541" stroke-width="2"/>
<text x="85.0" y="113.0" font-size="21" fill="#252a30" font-weight="700" text-anchor="middle">Text</text>
<text x="85.0" y="138.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">“The capital</text>
<text x="85.0" y="162.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">of France is”</text>
<rect x="200" y="70" width="150" height="120" rx="10" fill="#f3f5f6" stroke="#173541" stroke-width="2"/>
<text x="275.0" y="113.0" font-size="21" fill="#252a30" font-weight="700" text-anchor="middle">Tokens</text>
<text x="275.0" y="138.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">pieces of text</text>
<text x="275.0" y="162.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">→ integer IDs</text>
<rect x="390" y="70" width="150" height="120" rx="10" fill="#f3f5f6" stroke="#173541" stroke-width="2"/>
<text x="465.0" y="113.0" font-size="21" fill="#252a30" font-weight="700" text-anchor="middle">Embeddings</text>
<text x="465.0" y="138.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">one vector</text>
<text x="465.0" y="162.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">per token</text>
<rect x="580" y="70" width="160" height="120" rx="10" fill="#f7e6e3" stroke="#173541" stroke-width="2"/>
<text x="660.0" y="113.0" font-size="21" fill="#252a30" font-weight="700" text-anchor="middle">Transformer</text>
<text x="660.0" y="138.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">many layers</text>
<text x="660.0" y="162.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">of attention</text>
<rect x="780" y="70" width="160" height="120" rx="10" fill="#f3f5f6" stroke="#173541" stroke-width="2"/>
<text x="860.0" y="113.0" font-size="21" fill="#252a30" font-weight="700" text-anchor="middle">Probabilities</text>
<text x="860.0" y="138.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">for every</text>
<text x="860.0" y="162.0" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">possible token</text>
<rect x="980" y="70" width="130" height="120" rx="10" fill="#7a1f2b" stroke="#7a1f2b" stroke-width="2"/>
