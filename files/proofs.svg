<rect x="247" y="190" width="206" height="118" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="350.0" y="231.5" font-size="20" fill="#252a30" font-weight="700" text-anchor="middle">Kepler</text>
