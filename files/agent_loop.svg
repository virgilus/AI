<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>The agent loop: decide, act, observe</title><defs><marker id="m7a1f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f2b"/></marker><marker id="m173541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#173541"/></marker><marker id="me95459" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e95459"/></marker><marker id="m626a70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#626a70"/></marker><marker id="m252a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252a30"/></marker></defs>
<rect x="20" y="130" width="160" height="90" rx="10" fill="#173541" stroke="#173541" stroke-width="2"/>
<text x="100.0" y="170.5" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Goal</text>
<text x="100.0" y="196.5" font-size="17" fill="#fff" font-weight="400" text-anchor="middle">from a human</text>
<path d="M184,175 L306,175" fill="none" stroke="#173541" stroke-width="3" stroke-linejoin="round" marker-end="url(#m173541)"/>
<rect x="310" y="110" width="230" height="130" rx="10" fill="#f7e6e3" stroke="#7a1f2b" stroke-width="2"/>
<text x="425.0" y="157.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">1. Decide</text>
<text x="425.0" y="185.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">What is the next</text>
<text x="425.0" y="211.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">useful step?</text>
<rect x="720" y="30" width="230" height="110" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="835.0" y="80.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">2. Act</text>
<text x="835.0" y="108.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Call a tool</text>
<rect x="720" y="230" width="230" height="110" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="835.0" y="267.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">3. Observe</text>
<text x="835.0" y="295.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Read the result</text>
<text x="835.0" y="321.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">or the error</text>
<path d="M470,106 C520,60 620,70 716,82" fill="none" stroke="#e95459" stroke-width="3" stroke-linejoin="round" marker-end="url(#me95459)"/>
<path d="M835,144 L835,226" fill="none" stroke="#e95459" stroke-width="3" stroke-linejoin="round" marker-end="url(#me95459)"/>
<path d="M716,290 C620,300 520,300 470,244" fill="none" stroke="#e95459" stroke-width="3" stroke-linejoin="round" marker-end="url(#me95459)"/>
<text x="630" y="185" font-size="22" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">repeat</text>
<rect x="310" y="330" width="230" height="80" rx="10" fill="#173541" stroke="#173541" stroke-width="2"/>
<text x="425.0" y="365.5" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Result</text>
<text x="425.0" y="391.5" font-size="17" fill="#fff" font-weight="400" text-anchor="middle">goal reached</text>
<path d="M400,244 L400,326" fill="none" stroke="#626a70" stroke-width="2" stroke-linejoin="round" marker-end="url(#m626a70)" stroke-dasharray="6 6"/>
<text x="372" y="292" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">done</text>
<text x="110" y="300" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">A human can interrupt,</text>
<text x="110" y="325" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">correct or stop it</text>
<path d="M170,280 L304,225" fill="none" stroke="#626a70" stroke-width="2" stroke-linejoin="round" marker-end="url(#m626a70)" stroke-dasharray="6 6"/>
</svg>
