<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>A main agent delegates to subagents</title><defs><marker id="m7a1f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f2b"/></marker><marker id="m173541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#173541"/></marker><marker id="me95459" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e95459"/></marker><marker id="m626a70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#626a70"/></marker><marker id="m252a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252a30"/></marker></defs>
<rect x="410" y="10" width="300" height="90" rx="10" fill="#7a1f2b" stroke="#7a1f2b" stroke-width="2"/>
<text x="560.0" y="51.5" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">Main agent</text>
<text x="560.0" y="79.5" font-size="17" fill="#fff" font-weight="400" text-anchor="middle">splits the work, merges results</text>
<rect x="60" y="200" width="280" height="90" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="200.0" y="240.5" font-size="22" fill="#252a30" font-weight="700" text-anchor="middle">Subagent A</text>
<text x="200.0" y="266.5" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">reads the documentation</text>
<text x="200" y="320" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">own context window</text>
<path d="M440,104 L185,196" fill="none" stroke="#173541" stroke-width="3" stroke-linejoin="round" marker-end="url(#m173541)"/>
<path d="M220,196 L468,104" fill="none" stroke="#e95459" stroke-width="3" stroke-linejoin="round" marker-end="url(#me95459)"/>
<rect x="420" y="200" width="280" height="90" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="560.0" y="240.5" font-size="22" fill="#252a30" font-weight="700" text-anchor="middle">Subagent B</text>
<text x="560.0" y="266.5" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">searches the code</text>
<text x="560" y="320" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">own context window</text>
<path d="M545,104 L545,196" fill="none" stroke="#173541" stroke-width="3" stroke-linejoin="round" marker-end="url(#m173541)"/>
<path d="M580,196 L573,104" fill="none" stroke="#e95459" stroke-width="3" stroke-linejoin="round" marker-end="url(#me95459)"/>
<rect x="780" y="200" width="280" height="90" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="920.0" y="240.5" font-size="22" fill="#252a30" font-weight="700" text-anchor="middle">Subagent C</text>
<text x="920.0" y="266.5" font-size="17" fill="#626a70" font-weight="400" text-anchor="middle">reviews the result</text>
<text x="920" y="320" font-size="18" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">own context window</text>
