<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Three stages of training</title><defs><marker id="m7a1f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a1f2b"/></marker><marker id="m173541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#173541"/></marker><marker id="me95459" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e95459"/></marker><marker id="m626a70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#626a70"/></marker><marker id="m252a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252a30"/></marker></defs>
<rect x="10" y="40" width="340" height="180" rx="10" fill="#f3f5f6" stroke="#173541" stroke-width="2"/>
<text x="180.0" y="99.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">1. Pre-training</text>
<text x="180.0" y="127.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Huge text corpora</text>
<text x="180.0" y="153.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Predict the next token</text>
<text x="180.0" y="179.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">→ a text completer</text>
<rect x="390" y="40" width="340" height="180" rx="10" fill="#f7e6e3" stroke="#7a1f2b" stroke-width="2"/>
<text x="560.0" y="99.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">2. Fine-tuning</text>
<text x="560.0" y="127.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Examples of good answers</text>
<text x="560.0" y="153.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Imitate them</text>
<text x="560.0" y="179.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">→ follows instructions</text>
<rect x="770" y="40" width="340" height="180" rx="10" fill="#e3edf0" stroke="#173541" stroke-width="2"/>
<text x="940.0" y="99.5" font-size="24" fill="#252a30" font-weight="700" text-anchor="middle">3. Reinforcement</text>
<text x="940.0" y="127.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Human or automatic feedback</text>
<text x="940.0" y="153.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">Reward good behaviour</text>
<text x="940.0" y="179.5" font-size="19" fill="#626a70" font-weight="400" text-anchor="middle">→ helpful, reasons, uses tools</text>
<path d="M353,130 L387,130" fill="none" stroke="#173541" stroke-width="3" stroke-linejoin="round" marker-end="url(#m173541)"/>
<path d="M733,130 L767,130" fill="none" stroke="#173541" stroke-width="3" stroke-linejoin="round" marker-end="url(#m173541)"/>
<path d="M10,260 L1108,260" fill="none" stroke="#626a70" stroke-width="2" stroke-linejoin="round" marker-end="url(#m626a70)"/>
<rect x="370" y="245" width="380" height="30" rx="10" fill="#fff" stroke="none" stroke-width="2"/>
<text x="560" y="267" font-size="20" fill="#626a70" font-weight="400" text-anchor="middle" font-style="italic">less data, more human choices</text>
</svg>
